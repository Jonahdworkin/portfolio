  <header class="bar">

    <a href="about.html#contact" class="bar__contact mono" data-scramble>Contact</a>

  <canvas class="wave" aria-hidden="true"></canvas>

  <main class="proj" id="top">
    <section class="proj-hero" data-title="Cue" data-jp="日記">
      <h1 class="proj-hero__title sr-only">Cue — a music journal</h1>
    </section>

    <!-- a ring of phones: the title lands on the front one, scrolling turns the ring -->
    <section class="ring" data-ring aria-label="Cue, screen by screen">
      <div class="ring__stage">
        <div class="ring__spin">
        <figure class="ring__item"><div class="ring__phone"><span class="thumb ring__screen"><img src="assets/img/cue-01-today.webp" alt="Cue — One song a day: Tap the record to choose today&#x27;s song. The constraint is the point." /></span></div></figure>
        <figure class="ring__item"><div class="ring__phone"><span class="thumb ring__screen"><img src="assets/img/cue-02-feed.webp" alt="Cue — A friend&#x27;s song: Open the app and the first thing you see is what someone you follow cued today — with room for a comment." /></span></div></figure>
        <figure class="ring__item"><div class="ring__phone"><span class="thumb ring__screen"><img src="assets/img/cue-03-friends.webp" alt="Cue — Find your people: Follow friends, follow back, and see what everyone is listening to this week." /></span></div></figure>
        <figure class="ring__item"><div class="ring__phone"><span class="thumb ring__screen"><img src="assets/img/cue-04-artist.webp" alt="Cue — Artist pages: Every artist is ranked by the people who cued them: listeners, logs and a place on the chart." /></span></div></figure>
        <figure class="ring__item"><div class="ring__phone"><span class="thumb ring__screen"><img src="assets/img/cue-06-story.webp" alt="Cue — Stories: Pin a favourite artist or the song that defines you, and share it as a card." /></span></div></figure>
        <figure class="ring__item"><div class="ring__phone"><span class="thumb ring__screen"><img src="assets/img/cue-05-profile.webp" alt="Cue — Your year: 151 entries and a 74-day run. Highlights, and a journal you can open year by year." /></span></div></figure>
        </div>
      </div>
    </section>

    <section class="proj-info proj-info--short" data-reveal>
      <p class="proj-info__lede">A music journal. One song, once a day.</p>
    </section>

    <!-- two films: Cue away from the screen. They arrive in characters like every other screen,
         play in grey and take their colour in the middle of the view. Click one to hear it. -->
    <section class="films" id="films" aria-label="Cue films">
      <figure class="films__item">
        <span class="thumb films__frame"><img src="assets/img/cue-film-beach.webp" alt="Cue film — friends on the beach at golden hour" /><video muted loop playsinline preload="none" data-src="assets/video/cue-beach.mp4"></video></span>
        <button type="button" class="films__sound jp" aria-pressed="false" aria-label="Play the beach film's sound">音</button>
      </figure>
      <figure class="films__item">
        <span class="thumb films__frame"><img src="assets/img/cue-film-hill.webp" alt="Cue film — records laid out on a hilltop over the sea, Blond on the turntable" /><video muted loop playsinline preload="none" data-src="assets/video/cue-hill.mp4"></video></span>
        <button type="button" class="films__sound jp" aria-pressed="false" aria-label="Play the hilltop film's sound">音</button>
      </figure>
    </section>
